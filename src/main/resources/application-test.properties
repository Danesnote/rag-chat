# =====================================================================
# 테스트 서버(QA) 전용 설정 — spring.profiles.active=test 일 때 적용
#
# 공통값은 application.properties 를 상속하고, 아래 키만 override 한다.
# ★ TODO 로 표시된 값은 반드시 테스트 서버 실제 값으로 교체해야 앱이 정상 기동한다.
#   (dev/prod 주소·비밀번호를 그대로 쓰지 말 것 — 환경 격리를 위해 분리하는 목적)
# =====================================================================

# 검색 방식 기본값 (1: 하이브리드, 2: 하이브리드 + 인접 청크 확장). 요청에 값이 없을 때 사용
rag.retrieval.mode=2
# 테스트 서버에서는 QA가 두 방식을 모두 검증할 수 있도록 선택 UI 노출
rag.retrieval.mode-selector.visible=true

# ── vLLM ─────────────────────────────────────────────
rag.llm.url=${LLM_URL:http://localhost:8000/v1/chat/completions}
rag.llm.tokenize-url=${LLM_TOKENIZE_URL:http://localhost:8000/tokenize}
rag.llm.model=${LLM_MODEL:openai/gpt-oss-120b}
rag.llm.api-key=${LLM_API_KEY:}
# 스트리밍 응답에 usage(토큰수) 포함 요청. 서버가 stream_options를 거부하면 false로.
rag.llm.include-usage=true

# ── 시스템 프롬프트 ──────────────────────────────────
# 비우면 classpath:prompts/system-prompt.md 사용. 외부 파일로 운영하려면 절대경로 지정('/' 사용)
rag.prompt.system-path=

# ── 멀티턴 질의 재작성 ───────────────────────────────
rag.query-rewrite.enabled=true
rag.query-rewrite.first-turn=true
rag.query-rewrite.max-tokens=512
rag.query-rewrite.max-turns=3
rag.query-rewrite.max-query-chars=200
rag.query-rewrite.max-answer-chars=400

# ── 프롬프트 토큰 예산 ───────────────────────────────
context.rag.min-tokens=8000

spring.threads.virtual.enabled=true

# ── DataSource (테스트 DB) ───────────────────────────
# ★ 테스트 서버 DB로 교체. driver-class-name 은 실제 DB에 맞출 것
#   (PostgreSQL: org.postgresql.Driver / MySQL: com.mysql.cj.jdbc.Driver)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragchat}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# 테스트 서버에서는 SQL 로그를 끄되, 필요 시 임시로 true 로 켠다.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# ★ 위 DataSource 에 맞는 Dialect 로 교체 (PostgreSQL/MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── 에러 응답 (테스트: 디버깅 편의) ──────────────────
# 메시지는 노출하되, 스택트레이스는 ?trace=true 파라미터가 있을 때만 노출
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# ── 로깅 (테스트: 결함 분석 위해 앱은 상세, 프레임워크는 최소) ──
#  - 앱(com.ragchat)=DEBUG 로 [LLM] 전송 프롬프트/응답 전문,
#    [Retrieval] 문서별 앞/뒤 청크 상세까지 확인 가능
logging.level.root=INFO
logging.level.com.ragchat=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# ── SSO ──────────────────────────────────────────────
# 테스트 서버에 SSO 연동이 없으면 false(로그인 없이 화면 접근). 연동돼 있으면 true 로.
sso.required=false
sso.portal-url=/sso

rag.llm.seed=42
