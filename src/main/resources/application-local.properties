# =====================================================================
# local 프로파일 — 개발자 개인 PC(로컬) 실행용
#
# 특징: SSO 서버에 접근할 수 없는 로컬 환경. 인증을 전부 건너뛰고(sso.required=false)
#       sso.dev-user-seq 사용자로 바로 화면/ API 를 쓸 수 있다.
# (프로파일 미지정 시 application.properties 의 spring.profiles.default=local 로 이 파일이 적용된다.)
# =====================================================================

# 검색 방식 기본값 (1: 하이브리드, 2: 하이브리드 + 인접 청크 확장). 요청에 값이 없을 때 사용
rag.retrieval.mode=2
# 검색 방식 선택 UI 노출 여부 (local·test: 노출 / dev·prod: 숨김)
rag.retrieval.mode-selector.visible=true

rag.llm.url=${LLM_URL:http://localhost:8000/v1/chat/completions}
rag.llm.tokenize-url=${LLM_TOKENIZE_URL:http://localhost:8000/tokenize}
rag.llm.model=${LLM_MODEL:openai/gpt-oss-120b}
rag.llm.api-key=${LLM_API_KEY:}
# 스트리밍 응답에 usage(토큰수) 포함 요청. 서버가 stream_options를 거부하면 false로 변경(그러면 tokenize로 계산)
rag.llm.include-usage=true

# 시스템 프롬프트 외부 파일 경로 (비우면 classpath:prompts/system-prompt.md 사용)
# 주의: .properties에서 '\'는 이스케이프 문자이므로 경로는 '/'(또는 '\\')로 적는다.
rag.prompt.system-path=

# ── 멀티턴 질의 재작성 ────────────────────────────────
rag.query-rewrite.enabled=true
rag.query-rewrite.max-tokens=1024
rag.query-rewrite.reasoning-effort=low
rag.query-rewrite.max-turns=3
rag.query-rewrite.max-query-chars=200
rag.query-rewrite.max-answer-chars=400

context.rag.min-tokens=8000

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragchat}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# LLM 서빙 컨텍스트 한도 (gpt-oss-120b 기준)
server.context.max-tokens=131072
# 채팅 템플릿, Harmony 특수 토큰 및 계산 오차 여유
server.context.reserve-tokens=4096

request.input.simple.max-tokens=16384
request.input.normal.max-tokens=32768
request.input.complex.max-tokens=65536

request.generation.low.max-tokens=8192
request.generation.medium.max-tokens=16384
request.generation.high.max-tokens=32768

answer.normal.target-tokens=1500
answer.complex.target-tokens=3000

answer.final.max-tokens=6000

# 누적 요약 정책
summary.target-tokens=2500
summary.max-tokens=4000
summary.max-characters=16000

summary.compression.target-tokens=2000
summary.compression.max-tokens=3000
summary.compression.max-characters=12000

# 최근 원문 대화 정책
history.retained.target-tokens=8000
history.summarize.trigger-tokens=16000
history.memory.max-tokens=12000
input.safety-margin-tokens=2000

# ── SSO ─────────────────────────────────────────────
# 로컬은 SSO 서버에 접근할 수 없으므로 인증 과정을 전부 건너뛴다.
sso.required=false
# 인증 비활성 시 사용할 사용자 번호
sso.dev-user-seq=1
sso.portal-url=/sso

# ── 로깅 (로컬: 개발 편의 최대) ──────────────────────
logging.level.root=INFO
logging.level.com.ragchat=DEBUG

# ── 개발 전용 로그인 ────────────────────────────────
dev.login.id=devadmin
dev.login.password=${DEV_LOGIN_PASSWORD:}
dev.login.user-seq=2