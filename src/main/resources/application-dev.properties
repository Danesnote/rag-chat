# 검색 방식 기본값 (1: 하이브리드, 2: 하이브리드 + 인접 청크 확장). 요청에 값이 없을 때 사용
rag.retrieval.mode=2
# 검색 방식 선택 UI 노출 여부 (local·test: 노출 / dev·prod: 숨김)
rag.retrieval.mode-selector.visible=false

rag.llm.url=${LLM_URL:http://localhost:8000/v1/chat/completions}
rag.llm.tokenize-url=${LLM_TOKENIZE_URL:http://localhost:8000/tokenize}
rag.llm.model=${LLM_MODEL:openai/gpt-oss-120b}
rag.llm.api-key=${LLM_API_KEY:}
# 스트리밍 응답에 usage(토큰수) 포함 요청. 서버가 stream_options를 거부하면 false로 변경(그러면 tokenize로 계산)
rag.llm.include-usage=true

# 시스템 프롬프트 외부 파일 경로 (비우면 classpath:prompts/system-prompt.md 사용)
# 서버에는 로컬 경로가 없으므로 비워 classpath 기본을 쓰거나, 서버의 실제 경로로 지정한다.
# 주의: .properties에서 '\'는 이스케이프 문자이므로 경로는 '/'(또는 '\\')로 적는다.
rag.prompt.system-path=

# ── 멀티턴 질의 재작성 ────────────────────────────────
# 후속 질문("그럼 예외는?")을 이전 대화로 완결된 검색 질의문으로 바꿔 검색한다.
# false로 두면 질문 원문으로 검색한다. (첫 턴에는 호출하지 않음)
rag.query-rewrite.enabled=true
rag.query-rewrite.max-tokens=1024
# 추론 강도. 비워 두면 서버 기본값(medium)이 적용되어 추론이 max-tokens 를 다 써버린다.
rag.query-rewrite.reasoning-effort=low
rag.query-rewrite.max-turns=3
rag.query-rewrite.max-query-chars=200
rag.query-rewrite.max-answer-chars=400

spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragchat}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# LLM 서빙 컨텍스트 한도 (gpt-oss-120b 기준)
server.context.max-tokens=131072

# 채팅 템플릿, Harmony 특수 토큰 및 계산 오차 여유
server.context.reserve-tokens=4096

# 입력 상한
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. request.input.simple.max-tokens=16384
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. request.input.normal.max-tokens=32768
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. request.input.complex.max-tokens=65536

# reasoning effort별 전체 생성 상한
# 추론 토큰 + 최종 답변 토큰 + 기타 생성 토큰의 합계
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. request.generation.low.max-tokens=8192
request.generation.medium.max-tokens=16384
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. request.generation.high.max-tokens=32768

# 사용자에게 표시할 답변 목표
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. answer.normal.target-tokens=1500
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. answer.complex.target-tokens=3000

# final 채널 검증용 최대값
# API의 생성 상한이 아니라 애플리케이션 검증값
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. answer.final.max-tokens=6000

# 누적 요약 정책
# 요약 호출 추론 강도. 비우면 서버 기본값(medium)이 적용되어 추론이 예산을 잠식한다.
summary.reasoning-effort=low
summary.target-tokens=2500
summary.max-tokens=4000
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. summary.max-characters=16000

# 요약 재압축 정책
summary.compression.target-tokens=2000
# [미사용] 코드에서 참조하지 않음. 연결 시 주석 해제할 것. summary.compression.max-tokens=3000
summary.compression.max-characters=12000

# 최근 원문 대화 정책
history.retained.target-tokens=8000
history.summarize.trigger-tokens=16000

# 누적 요약 + 최근 원문 최대 합계
history.memory.max-tokens=12000

# 입력 구성의 최소 안전 여유
input.safety-margin-tokens=2000

# [CONTEXT]에 최소한 확보할 토큰. 여유가 이보다 적으면 오래된 대화 턴부터 버려 확보한다.
context.rag.min-tokens=8000

# ── SSO ─────────────────────────────────────────────
# dev(개발 서버)는 SSO 를 사용한다. SSO 포털을 거치지 않는 접근은
# 아래 개발 전용 로그인 페이지(/dev/login)로만 허용한다.
# (SSO 없이 자유 접근이 필요한 개인 PC 환경은 local 프로파일을 사용한다.)
sso.required=true

# SSO 미식별 시 폴백 사용자 번호(sso.required=true 에서는 사용되지 않음. 형식상 유지)
sso.dev-user-seq=1

# 인증 실패 시 "확인" 을 누르면 이동할 주소 (SSO 포털 주소로 교체)
sso.portal-url=/sso

# ── 개발 전용 로그인 (@Profile("dev") 에서만 로딩. local/test/prod 에는 없음) ──
# SSO 포털을 거치지 않고 개발 계정으로 개발 WAS 에 접근하기 위한 페이지: GET/POST /dev/login
#  - dev.login.password 를 설정해야 로그인 폼이 활성화된다. (비우면 비활성 → 안전 기본값)
#  - dev.login.user-seq 는 세션에 심을 사용자 번호(숫자). currentUserSeq 가 이 값으로 데이터를 분리.
#  - 자격증명은 소스가 아니라 이 프로파일 properties 에서만 주입된다.
dev.login.id=devadmin
dev.login.password=${DEV_LOGIN_PASSWORD:}
dev.login.user-seq=1

# ── 로깅 (개발) ──────────────────────────────────────
# 앱 패키지 전체를 DEBUG 로 열어 개발 편의를 최대화한다.
#  - [LLM] 전송 프롬프트 / 응답 전문, 스트리밍 청크 원문
#  - [Retrieval] 문서별 앞/뒤 청크 부착 상세, [QueryRewrite]/[Summary] LLM 원문
logging.level.root=INFO
logging.level.com.ragchat=DEBUG

# ── SSE 응답 제한 시간 ──────────────────────────────
# 질의 재작성 → 검색 → 답변 생성 전체가 이 시간 안에 끝나야 한다.
# 이벤트를 보내도 연장되지 않는 절대 시간이며, 초과하면 답변이 잘린다.
rag.sse.timeout-ms=180000

# 화면에 표시할 출처 최대 건수. 0 이하면 [CONTEXT]에 담긴 문서를 전부 표시한다.
# CONTEXT 문서 수보다 작게 두면 LLM이 인용한 [문서N]이 화면에 없어 채택 표시가 누락된다.
rag.retrieval.source-display-limit=0
