<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 · AI 어시스턴트</title>

    <link rel="icon" href="/img/favicon.ico" th:href="@{/img/favicon.ico}">

    <!--
      [주의] 이 페이지는 애플리케이션이 비정상일 때 표시된다.
      따라서 jQuery·Lucide·marked 같은 스크립트에 의존하지 않고,
      CSS 와 인라인 SVG 만으로 구성한다. (의존성이 많으면 오류 화면조차 깨진다)
    -->
    <link href="/css/tailwind.css" th:href="@{/css/tailwind.css}" rel="stylesheet">
    <link href="/css/chat_default.css" th:href="@{/css/chat_default.css}" rel="stylesheet">

    <script>
        // 채팅 화면과 동일한 테마 기준을 적용한다. (저장소 차단 환경에서도 죽지 않도록 감싼다)
        (function () {
            var savedTheme = null;
            try { savedTheme = localStorage.getItem('theme'); } catch (e) { /* 저장소 차단 환경 */ }

            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f0f2f5] dark:bg-[#111111] text-gray-800 dark:text-[#e0e0e0] p-4 md:p-6 transition-colors duration-300">

<main class="w-full max-w-[520px] bg-white dark:bg-[#262626] border border-gray-200 dark:border-[#3a3a3a] rounded-[24px] shadow-2xl p-8 md:p-10 transition-colors">

    <!-- 브랜드 마크 (채팅 화면과 동일한 sparkles 아이콘을 인라인 SVG 로) -->
    <div class="flex items-center gap-2.5 mb-8">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7 text-blue-600 dark:text-[#00ffd1] shrink-0" aria-hidden="true">
            <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
        </svg>
        <span class="text-[13px] font-bold tracking-wider text-gray-500 dark:text-gray-400">AI 어시스턴트</span>
    </div>

    <!-- 상태 코드 -->
    <div class="flex items-baseline gap-3 mb-3">
        <span class="text-[44px] md:text-[52px] font-black leading-none tracking-tighter tabular-nums text-gray-900 dark:text-gray-100"
              th:text="${status} ?: '오류'">500</span>
        <span class="text-[15px] font-bold text-gray-400 dark:text-gray-500 break-keep"
              th:text="${error}">Internal Server Error</span>
    </div>

    <h1 class="text-[20px] md:text-[22px] font-bold text-gray-900 dark:text-gray-100 leading-snug break-keep mb-3">
        요청을 처리하는 중 오류가 발생했습니다.
    </h1>

    <p class="text-[14px] text-gray-600 dark:text-gray-400 leading-relaxed break-keep">
        일시적인 문제일 수 있습니다. 이전 페이지로 돌아가 다시 시도해 주세요.<br>
        문제가 계속되면 담당자에게 문의해 주세요.
    </p>

    <!-- 상세 메시지: 운영 환경(include-message=never)에서는 비어 있어 노출되지 않는다. -->
    <div th:if="${message != null and !#strings.isEmpty(message)}"
         class="mt-6 p-3.5 rounded-lg bg-gray-50 dark:bg-[#1e1e1e]/60 border border-gray-200 dark:border-[#3a3a3a] transition-colors">
        <div class="text-[11px] font-bold text-gray-400 dark:text-gray-500 mb-1.5 tracking-wide">상세 메시지</div>
        <p class="text-[13px] text-gray-700 dark:text-gray-300 leading-relaxed break-words" th:text="${message}">에러 메시지</p>
    </div>

    <!-- 요청 경로 -->
    <div th:if="${path != null and !#strings.isEmpty(path)}"
         class="mt-3 text-[12px] text-gray-400 dark:text-gray-500 break-all">
        <span class="font-bold">요청 경로</span>
        <span th:text="${path}">/chat/main</span>
    </div>

    <!-- 동작 버튼 -->
    <div class="flex flex-col sm:flex-row gap-2.5 mt-8">
        <button type="button" onclick="history.back()"
                class="flex-1 px-4 py-2.5 rounded-lg text-[14px] font-bold text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-500 transition-colors">
            이전 페이지로 돌아가기
        </button>
        <a href="/chat/main" th:href="@{/chat/main}"
           class="flex-1 px-4 py-2.5 rounded-lg text-[14px] font-bold text-center text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-[#333333] hover:bg-gray-200 dark:hover:bg-[#3a3a3a] border border-gray-200 dark:border-[#3a3a3a] transition-colors">
            새 대화 시작하기
        </a>
    </div>

</main>

</body>
</html>
