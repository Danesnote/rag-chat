spring.application.name=rag-chat

# 프로파일 4분기: local(개인PC·무SSO) / dev(개발서버·SSO+개발로그인) / test(테스트서버) / prod(운영)
# 아무 프로파일도 지정하지 않으면 local 을 사용한다(개인 PC 개발 편의).
# 각 서버 배포 시 실행 환경에서 spring.profiles.active=dev|test|prod 로 override 한다.
spring.profiles.default=local

server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ── 화면 표시 ────────────────────────────────────────
# 브라우저 제목·사이드바·인사 문구에 쓰는 어시스턴트 이름
rag.ui.assistant-name=AI 어시스턴트
# 상단 바에 표시할 모델 이름 (비우면 rag.llm.model 값을 그대로 표시)
rag.ui.model-label=
# 출처 원문 바로가기 URL 접두사. 뒤에 문서번호가 붙는다. 비우면 바로가기 버튼을 숨긴다.
# 예) rag.ui.source-view-url=https://docs.example.com/view?id=
rag.ui.source-view-url=

# ── DB 스키마 ────────────────────────────────────────
# 기동 시 db/schema.sql 실행 (모든 구문이 IF NOT EXISTS 라 반복 실행해도 안전). JPA 는 그 뒤에 검증만 한다.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ── 임베딩 (OpenAI 호환 /v1/embeddings — 기본: HuggingFace TEI + BAAI/bge-m3) ──
rag.embedding.url=${EMBEDDING_URL:http://localhost:8081/v1/embeddings}
rag.embedding.model=${EMBEDDING_MODEL:BAAI/bge-m3}
rag.embedding.api-key=${EMBEDDING_API_KEY:}
# db/schema.sql 의 vector(N) 과 같아야 한다
rag.embedding.dimension=1024
rag.embedding.batch-size=8

# ── 리랭커 (TEI /rerank — 기본: BAAI/bge-reranker-v2-m3) ──
# 끄면 RRF 순위 상위 top-n 을 그대로 사용한다
rag.reranker.enabled=${RERANKER_ENABLED:true}
rag.reranker.url=${RERANKER_URL:http://localhost:8082/rerank}

# ── 하이브리드 검색 ──────────────────────────────────
rag.search.vector-top-k=20
rag.search.keyword-top-k=20
# Reciprocal Rank Fusion 상수
rag.search.rrf-k=60
rag.search.rerank-candidates=20
# LLM 에 근거로 넘길 최종 청크 수 (모드2 는 여기에 앞/뒤 청크가 더해진다)
rag.search.top-n=5

# ── 문서 적재 ────────────────────────────────────────
# /api/documents 관리 API 사용 여부 (prod 에서는 false)
rag.ingest.enabled=true
# 청크 최대 글자 수. 조문형 문서는 조문 단위로 자르고, 긴 조문만 이 길이로 나눈다.
rag.ingest.chunk-max-chars=800
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
