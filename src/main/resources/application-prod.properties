# 검색 방식 기본값 (1: 하이브리드, 2: 하이브리드 + 인접 청크 확장). 요청에 값이 없을 때 사용
rag.retrieval.mode=2
# 검색 방식 선택 UI 노출 여부 (local·test: 노출 / dev·prod: 숨김)
rag.retrieval.mode-selector.visible=false

rag.llm.url=${LLM_URL:http://localhost:8000/v1/chat/completions}
rag.llm.tokenize-url=${LLM_TOKENIZE_URL:http://localhost:8000/tokenize}
rag.llm.model=${LLM_MODEL:openai/gpt-oss-120b}
rag.llm.api-key=${LLM_API_KEY:}
# 스트리밍 응답에 usage(토큰수) 포함 요청. 서버가 stream_options를 거부하면 false로 변경(그러면 tokenize로 계산)
rag.llm.include-usage=true

# 시스템 프롬프트 외부 파일 경로 (비우면 classpath:prompts/system-prompt.md 사용)
# 예) rag.prompt.system-path=/app/config/system-prompt.md
rag.prompt.system-path=

# ── 멀티턴 질의 재작성 ────────────────────────────────
# 후속 질문("그럼 예외는?")을 이전 대화로 완결된 검색 질의문으로 바꿔 검색한다.
# 검색 직전 LLM 1회(비스트리밍, 512토큰) 추가 호출이며, 첫 턴에는 호출하지 않는다.
# 문제가 생기면 false로 두면 질문 원문으로 검색한다.
rag.query-rewrite.enabled=true
rag.query-rewrite.max-tokens=1024
# 추론 강도. 비워 두면 서버 기본값(medium)이 적용되어 추론이 max-tokens 를 다 써버린다.
rag.query-rewrite.reasoning-effort=low
rag.query-rewrite.max-turns=3
rag.query-rewrite.max-query-chars=200
rag.query-rewrite.max-answer-chars=400

# ── 프롬프트 토큰 예산 (미지정 시 ContextBudget 기본값 사용) ──
# [CONTEXT]에 최소한 확보할 토큰. 여유가 이보다 적으면 오래된 대화 턴부터 버려 확보한다.
context.rag.min-tokens=8000

# 요약 호출 추론 강도. 비우면 서버 기본값(medium)이 적용되어 추론이 예산을 잠식한다.
summary.reasoning-effort=low

spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragchat}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# 운영에서는 SQL 로그를 남기지 않는다(로그 폭증·성능·데이터 노출 방지).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ── 로깅 (운영) ──────────────────────────────────────
# 프레임워크 소음은 WARN 으로 줄이고, 앱 로그는 INFO 로 운영 지표/이벤트만 남긴다.
#    [Budget]/[Context] 토큰 지표, [LLM] 응답 길이·토큰수, [Summary] 저장, [QueryRewrite] 결과
#  - 숨김(DEBUG): [LLM] 전송 프롬프트/응답 전문, 스트리밍 청크, LLM 원문, 문서별 앞/뒤 상세
#  - 문제 분석이 필요할 때만 아래 한 줄을 DEBUG 로 바꿔 임시로 상세 로그를 켠다.
logging.level.root=WARN
logging.level.com.ragchat=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# ── SSO ─────────────────────────────────────────────
# 운영에서는 반드시 true. 세션에 SSO 토큰이 없으면 화면 자체를 내려주지 않는다.
sso.required=true
# 인증 실패 시 "확인" 을 누르면 이동할 주소 (SSO 포털 주소로 교체 필요)
sso.portal-url=/sso

# ── SSE 응답 제한 시간 ──────────────────────────────
# 질의 재작성 → 검색 → 답변 생성 전체가 이 시간 안에 끝나야 한다.
# 이벤트를 보내도 연장되지 않는 절대 시간이며, 초과하면 답변이 잘린다.
rag.sse.timeout-ms=180000

# 화면에 표시할 출처 최대 건수. 0 이하면 [CONTEXT]에 담긴 문서를 전부 표시한다.
# CONTEXT 문서 수보다 작게 두면 LLM이 인용한 [문서N]이 화면에 없어 채택 표시가 누락된다.
rag.retrieval.source-display-limit=0

# ── 문서 관리 / 스키마 ──────────────────────────────
# 운영에서는 문서 관리 API(/api/documents)를 닫고, 스키마는 DBA 가 db/schema.sql 로 미리 생성한다.
rag.ingest.enabled=false
spring.sql.init.mode=never
